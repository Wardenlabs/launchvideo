<!DOCTYPE html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Warden launch film</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #F5F5F5; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #F5F5F5; }

      #film-ground { position:absolute; inset:0; background:#F5F5F5; overflow:hidden; }
      #film-field { position:absolute; inset:-450px -500px; opacity:.32; }
      .film-fragment { position:absolute; width:720px; height:180px; border:1px solid #CECECE; border-radius:16px; background:#fff; padding:40px; }
      .film-fragment i { display:block; height:9px; background:#D5D5D5; width:62%; margin-bottom:24px; }
      .film-fragment i:last-child { width:38%; height:7px; }
    </style>
  </head>
  <body>
    <!-- Six direct beats. Short overlaps preserve visual continuity while
         letting the edit snap forward. Product components carry the story;
         statements are bridges, never pauses. -->
    <div data-hf-id="hf-kft1" id="root" data-composition-id="main" data-start="0" data-duration="20.2" data-width="1920" data-height="1080">
      <div data-hf-id="hf-t7xj" id="film-ground" data-layout-allow-overlap="" data-layout-allow-occlusion=""><div data-hf-id="hf-pfgy" id="film-field" aria-hidden="true" data-layout-allow-overflow="" data-layout-allow-overlap=""></div></div>
      <div data-hf-id="hf-rhke" id="s00" style="z-index:21" data-composition-id="00-meet" data-composition-src="compositions/frames/00-meet.html" data-start="0" data-duration="1.8" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-j2gc" id="s01" style="z-index:20" data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html" data-start="1.55" data-duration="2.3" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-mxyh" id="s04" style="z-index:17" data-composition-id="04-sentence-to-rules" data-composition-src="compositions/frames/04-sentence-to-rules.html" data-start="3.65" data-duration="4.8" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-n4v6" id="s06" style="z-index:16" data-composition-id="06-check-before-model" data-composition-src="compositions/frames/06-check-before-model.html" data-start="8.1" data-duration="4.2" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-v2om" id="s05" style="z-index:15" data-composition-id="05-blocked" data-composition-src="compositions/frames/05-blocked.html" data-start="11.95" data-duration="3.5" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-tezu" id="s07" style="z-index:14" data-composition-id="07-cta" data-composition-src="compositions/frames/07-cta.html" data-start="15.1" data-duration="5.1" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- Voice-over: Hale v3 (ElevenLabs wWWn96OtTHu1sn8SRGEr, a library voice
           trained for eleven_v3), one take (assets/audio/vo/hale-v3-take2.mp3,
           stability 1.0 "Robust", speed 1.18, a single [confident] tag). Chosen
           over Brian, who had been in the film first. v3's Natural setting was
           tried for more emotion and made the read slower, not faster. The take
           is cut into phrases so the film sets the silences, not the take.
           "Turn" lands on Activate (6.65) and "doesn't" just after the Blocked
           stamp (13.21). Hale's first line is 3.9 s, so even from 0 "servers"
           arrives at 3.36, as the file flies into the cloud, not on the send.
           "Write one rule, in plain words" is sped up 6% (atempo, pitch kept)
           to fit between the first line and "Turn". "Warden." was spoken
           before the slogan in the take and is placed after it. -->
      <audio data-hf-id="hf-ew2h" id="vo-01" src="assets/audio/vo/01-servers.wav" data-start="0" data-duration="4.1" data-track-index="10" data-volume="1"></audio>
      <audio data-hf-id="hf-d7id" id="vo-02" src="assets/audio/vo/02-write.wav" data-start="4.14" data-duration="2.403" data-track-index="10" data-volume="1"></audio>
      <audio data-hf-id="hf-ygl2" id="vo-03" src="assets/audio/vo/03-turn-on.wav" data-start="6.61" data-duration="1.07" data-track-index="10" data-volume="1"></audio>
      <audio data-hf-id="hf-ofkn" id="vo-04" src="assets/audio/vo/04-checks.wav" data-start="8.17" data-duration="3.92" data-track-index="10" data-volume="1"></audio>
      <audio data-hf-id="hf-njqg" id="vo-05" src="assets/audio/vo/05-doesnt.wav" data-start="12.16" data-duration="2.26" data-track-index="10" data-volume="1"></audio>
      <audio data-hf-id="hf-k9i3" id="vo-06" src="assets/audio/vo/06-slogan.wav" data-start="15.16" data-duration="2.44" data-track-index="10" data-volume="1"></audio>
      <audio data-hf-id="hf-ubx2" id="vo-07" src="assets/audio/vo/07-warden.wav" data-start="17.72" data-duration="1.2" data-track-index="10" data-volume="1"></audio>

      <!-- Sound, level 1: only the three hits. The voice runs almost without a
           break, so every sound is short, dry and has no melody. One button
           (ElevenLabs, "deep, satisfying physical button press", trimmed to its
           first 300 ms) is the film's click, the way one cursor is its gesture;
           what follows the button says what happened. Sent: the button and the
           file's whoosh, peaking as it accelerates into the cloud. Active: the
           button with a two-note chime synthesised on top (E6, B6). Blocked:
           the same button doubled with a copy a fourth lower, so it reads as
           the same press, heavier. Generated kicks were tried for the block and
           rejected by the owner as unrelated to a block. -->
      <audio data-hf-id="hf-n4dy" id="sfx-send" src="assets/audio/sfx/button.wav" data-start="2.96" data-duration="0.3" data-track-index="11" data-volume="0.95"></audio>
      <audio data-hf-id="hf-tfkb" id="sfx-fly" src="assets/audio/sfx/whoosh.wav" data-start="3.22" data-duration="0.6" data-track-index="12" data-volume="0.75"></audio>
      <audio data-hf-id="hf-7tcj" id="sfx-active" src="assets/audio/sfx/lockin.wav" data-start="6.64" data-duration="0.575" data-track-index="11" data-volume="0.95"></audio>
      <audio data-hf-id="hf-2mh0" id="sfx-block" src="assets/audio/sfx/block.wav" data-start="13.2" data-duration="0.622" data-track-index="11" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const field = document.getElementById('film-field');
      for (let i=0; i<24; i++) {
        const fragment=document.createElement('div');
        fragment.className='film-fragment';
        fragment.style.left=((i%4)*770)+'px';
        fragment.style.top=(Math.floor(i/4)*230)+'px';
        fragment.innerHTML='<i></i><i></i>';
        fragment.setAttribute('data-layout-allow-overflow','');
        fragment.setAttribute('data-layout-allow-overlap','');
        field.appendChild(fragment);
      }
      tl.fromTo('#film-field',{x:-70,y:-60,rotation:-9,scale:1.05},{x:240,y:-410,rotation:-9,duration:20.2,ease:'none'},0);
      tl.to('#film-field',{opacity:.17,duration:.3},3.55);
      tl.to('#film-field',{opacity:.27,duration:.35},8.05);
      // The only time the ground changes colour: block-pink (Figma, "fondos al
      // 10%: solo para mensajes de feedback"), in one snap on the instant the
      // verdict stamps in frame 5 (11.95 + 1.08), and back to grey as the close
      // begins. It used to go black here and stay black; the film is light
      // (owner, 2026-09-23), and the hit is the flip, not the darkness.
      tl.to('#film-ground',{backgroundColor:'#FFF0F3',duration:.07,ease:'power2.out'},13.03);
      tl.to('#film-field',{opacity:.5,duration:.25},13.03);
      tl.to('#film-field',{scale:1.24,duration:.4,ease:'power4.inOut'},15.0);
      tl.to('#film-ground',{backgroundColor:'#F5F5F5',duration:.35,ease:'power2.inOut'},15.15);
      tl.to('#film-field',{opacity:.28,duration:.5},16.0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
