<!DOCTYPE html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Warden launch film</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #F5F5F5; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #F5F5F5; }

      #film-ground { position:absolute; inset:0; background:#F5F5F5; overflow:hidden; }
      #film-field { position:absolute; inset:-450px -500px; opacity:.32; }
      .film-fragment { position:absolute; width:720px; height:180px; border:1px solid #CECECE; border-radius:16px; background:#fff; padding:40px; }
      .film-fragment i { display:block; height:9px; background:#D5D5D5; width:62%; margin-bottom:24px; }
      .film-fragment i:last-child { width:38%; height:7px; }
    </style>
  </head>
  <body>
    <!-- Seven compact beats. Short overlaps preserve visual continuity while
         letting the edit snap forward. Product components carry the story;
         statements are bridges, never pauses. -->
    <div data-hf-id="hf-kft1" id="root" data-composition-id="main" data-start="0" data-duration="20.65" data-width="1920" data-height="1080">
      <div data-hf-id="hf-t7xj" id="film-ground" data-layout-allow-overlap="" data-layout-allow-occlusion=""><div data-hf-id="hf-pfgy" id="film-field" aria-hidden="true" data-layout-allow-overflow="" data-layout-allow-overlap=""></div></div>
      <div data-hf-id="hf-rhke" id="s00" style="z-index:21" data-composition-id="00-meet" data-composition-src="compositions/frames/00-meet.html" data-start="0" data-duration="1.8" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-j2gc" id="s01" style="z-index:20" data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html" data-start="1.55" data-duration="2" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-8x6e" id="s02" style="z-index:19" data-composition-id="02-signed-the-policy" data-composition-src="compositions/frames/02-signed-the-policy.html" data-start="3.15" data-duration="5.2" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-jkko" id="s03" style="z-index:18" data-composition-id="03-warden" data-composition-src="compositions/frames/03-warden.html" data-start="7.95" data-duration="1.3" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-mxyh" id="s04" style="z-index:17" data-composition-id="04-sentence-to-rules" data-composition-src="compositions/frames/04-sentence-to-rules.html" data-start="9.05" data-duration="5.8" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-v2om" id="s05" style="z-index:16" data-composition-id="05-blocked" data-composition-src="compositions/frames/05-blocked.html" data-start="14.45" data-duration="3.2" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-tezu" id="s07" style="z-index:14" data-composition-id="07-cta" data-composition-src="compositions/frames/07-cta.html" data-start="17.25" data-duration="3.4" data-track-index="1" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const field = document.getElementById('film-field');
      for (let i=0; i<24; i++) {
        const fragment=document.createElement('div');
        fragment.className='film-fragment';
        fragment.style.left=((i%4)*770)+'px';
        fragment.style.top=(Math.floor(i/4)*230)+'px';
        fragment.innerHTML='<i></i><i></i>';
        fragment.setAttribute('data-layout-allow-overflow','');
        fragment.setAttribute('data-layout-allow-overlap','');
        field.appendChild(fragment);
      }
      tl.fromTo('#film-field',{x:-70,y:-60,rotation:-9,scale:1.05},{x:160,y:-350,rotation:-9,duration:20.65,ease:'none'},0);
      tl.to('#film-field',{opacity:.17,duration:.3},7.8);
      tl.to('#film-ground',{backgroundColor:'#111111',duration:.2},14.55);
      tl.to('.film-fragment',{backgroundColor:'#191919',borderColor:'#303030',duration:.2},14.55);
      tl.to('.film-fragment i',{backgroundColor:'#444444',duration:.2},14.55);
      tl.to('#film-field',{opacity:.75,duration:.25},14.55);
      tl.to('#film-field',{scale:1.2,duration:.35,ease:'power4.inOut'},17.15);
      tl.to('#film-field',{opacity:.3,duration:.45},18.0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
