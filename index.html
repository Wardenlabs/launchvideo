<!DOCTYPE html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Warden launch film</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #F5F5F5; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #F5F5F5; }

      #film-ground { position:absolute; inset:0; background:#F5F5F5; overflow:hidden; }
      #film-field { position:absolute; inset:-450px -500px; opacity:.32; }
      .film-fragment { position:absolute; width:720px; height:180px; border:1px solid #CECECE; border-radius:16px; background:#fff; padding:40px; }
      .film-fragment i { display:block; height:9px; background:#D5D5D5; width:62%; margin-bottom:24px; }
      .film-fragment i:last-child { width:38%; height:7px; }
    </style>
  </head>
  <body>
    <!-- Six direct beats. Short overlaps preserve visual continuity while
         letting the edit snap forward. Product components carry the story;
         statements are bridges, never pauses. -->
    <div data-hf-id="hf-kft1" id="root" data-composition-id="main" data-start="0" data-duration="18.6" data-width="1920" data-height="1080">
      <div data-hf-id="hf-t7xj" id="film-ground" data-layout-allow-overlap="" data-layout-allow-occlusion=""><div data-hf-id="hf-pfgy" id="film-field" aria-hidden="true" data-layout-allow-overflow="" data-layout-allow-overlap=""></div></div>
      <div data-hf-id="hf-rhke" id="s00" style="z-index:21" data-composition-id="00-meet" data-composition-src="compositions/frames/00-meet.html" data-start="0" data-duration="0.86" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-j2gc" id="s01" style="z-index:20" data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html" data-start="0.72" data-duration="2.12" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-689x" id="s03" class="clip" style="z-index:19" data-composition-id="03-warden" data-composition-src="compositions/frames/03-warden.html" data-start="2.72" data-duration="1.84" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-mxyh" id="s04" style="z-index:17" data-composition-id="04-sentence-to-rules" data-composition-src="compositions/frames/04-sentence-to-rules.html" data-start="4.44" data-duration="2.22" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-n4v6" id="s06" style="z-index:16" data-composition-id="06-check-before-model" data-composition-src="compositions/frames/06-check-before-model.html" data-start="6.5" data-duration="3.14" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-v2om" id="s05" style="z-index:15" data-composition-id="05-blocked" data-composition-src="compositions/frames/05-blocked.html" data-start="9.5" data-duration="4.68" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-tezu" id="s07" style="z-index:14" data-composition-id="07-cta" data-composition-src="compositions/frames/07-cta.html" data-start="14.08" data-duration="4.52" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- One continuous take, aligned to the measured spoken words keeps the narration present from the
           opening leak through the final download address. -->
      <audio data-hf-id="hf-ew2h" id="voiceover" src="assets/audio/vo/liam-v3-synced.mp3" data-start="0" data-duration="18.23" data-playback-rate="1.25" data-track-index="10" data-volume="1"></audio>

      <!-- Sound, level 1: only the three hits. The voice runs almost without a
           break, so every sound is short, dry and has no melody. One button
           (ElevenLabs, "deep, satisfying physical button press", trimmed to its
           first 300 ms) is the film's click, the way one cursor is its gesture;
           what follows the button says what happened. Sent: the button and the
           file's whoosh, peaking as it accelerates into the cloud. Active: the
           button with a two-note chime synthesised on top (E6, B6). Blocked:
           the same button doubled with a copy a fourth lower, so it reads as
           the same press, heavier. Generated kicks were tried for the block and
           rejected by the owner as unrelated to a block. -->
      <!-- The opener's rows rush the camera: a soft cinematic whoosh the owner
           generated in ElevenLabs, trimmed to start 0.25 s in so its peak lands
           while the rows move fastest (~0.25 s); 0.1 s in read as late. -->
      <audio data-hf-id="hf-wnkj" id="sfx-open" src="assets/audio/sfx/whoosh-open.wav" data-start="0" data-duration="1.2" data-track-index="12" data-volume="0.8" data-fade-in="0.16"></audio>
      <!-- Every exit through the camera: one soft transition whoosh the owner
           generated in ElevenLabs ("Soft woosh transition"), cut to its rise
           and peak (0.1-0.8 s of the original) so it grows with the power4.in
           push and peaks on the cut. Low-passed at 6 kHz and at 0.2 because the
           owner asked for it soft, not invasive; the hiss on top is what makes
           a whoosh intrude. One camera sound for the whole film, pitched +2, +1, 0, -1, -3 semitones
           across the five exits (tape-style, so lower is also longer) so the
           repeat does not read as a loop and the sound gains weight toward the
           block and the close; peaks still land on the cuts. The hook's exit
           is left out: the file's flight already has its own whoosh. -->
      <audio data-hf-id="hf-mj1r" id="sfx-exit-00" src="assets/audio/sfx/whoosh-exit-00.wav" data-start="0.66" data-duration="0.62" data-track-index="13" data-volume="0.29"></audio>
      <audio data-hf-id="hf-wy9f" id="sfx-exit-04" src="assets/audio/sfx/whoosh-exit-04.wav" data-start="6.32" data-duration="0.66" data-track-index="13" data-volume="0.32"></audio>
      <audio data-hf-id="hf-k70s" id="sfx-exit-06" src="assets/audio/sfx/whoosh-exit-06.wav" data-start="9.28" data-duration="0.70" data-track-index="13" data-volume="0.32"></audio>
      <audio data-hf-id="hf-xi1e" id="sfx-exit-05" src="assets/audio/sfx/whoosh-exit-05.wav" data-start="13.82" data-duration="0.74" data-track-index="13" data-volume="0.35"></audio>
      <audio data-hf-id="hf-an9t" id="sfx-exit-07" src="assets/audio/sfx/whoosh-exit-07.wav" data-start="16.56" data-duration="0.83" data-track-index="13" data-volume="0.32"></audio>
      <!-- Owner, 2026-09-24: the effects were barely there on a phone. button.wav
           peaks at -28 dB, 24 dB under the voice, so the send now plays
           button-loud.wav: the same file with +22 dB of plain gain, no EQ or
           compression. Every other effect raised about 4 dB (x1.6). -->
      <audio data-hf-id="hf-n4dy" id="sfx-send" src="assets/audio/sfx/button-loud.wav" data-start="1.12" data-duration="0.3" data-track-index="11" data-volume="1.0"></audio>
      <audio data-hf-id="hf-tfkb" id="sfx-fly" src="assets/audio/sfx/whoosh.wav" data-start="1.72" data-duration="0.6" data-track-index="12" data-volume="1.2"></audio>
      <!-- Draft rule: a crisp two-part click the owner generated in ElevenLabs.
           Its press and release are 0.12 s apart; the button sinks at 4.93 and
           springs back at 5.01, so the first click is put on the sink. -->
      <audio data-hf-id="hf-qvy1" id="sfx-draft" src="assets/audio/sfx/click-draft.wav" data-start="5.16" data-duration="0.4" data-track-index="11" data-volume="1.12"></audio>
      <audio data-hf-id="hf-7tcj" id="sfx-active" src="assets/audio/sfx/lockin.wav" data-start="5.92" data-duration="0.575" data-track-index="11" data-volume="1.52"></audio>
      <audio data-hf-id="hf-2mh0" id="sfx-block" src="assets/audio/sfx/block.wav" data-start="10.76" data-duration="0.622" data-track-index="11" data-volume="1.6"></audio>

      <!-- Music candidate: "Just Flow" by Hartzmann (Uppbeat, credit owed in the
           description if published), from 11.07 s so its drop, the first hard
           kick at 17.72, lands on "Turn it on" (6.65): the storyboard's one
           build. Before it, the track's soft intro carries the problem. A cut to
           silence under the Blocked stamp was tried and removed: the owner wants
           the music at one constant level, only a one-second fade at the end. The owner is
           auditioning several tracks this way and will pick one. -->
      <audio data-hf-id="hf-c31s" id="music" src="assets/audio/music/just-flow.wav" data-start="0" data-duration="18.6" data-track-index="14" data-volume="0.1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const field = document.getElementById('film-field');
      for (let i=0; i<24; i++) {
        const fragment=document.createElement('div');
        fragment.className='film-fragment';
        fragment.style.left=((i%4)*770)+'px';
        fragment.style.top=(Math.floor(i/4)*230)+'px';
        fragment.innerHTML='<i></i><i></i>';
        fragment.setAttribute('data-layout-allow-overflow','');
        fragment.setAttribute('data-layout-allow-overlap','');
        field.appendChild(fragment);
      }
      tl.fromTo('#film-field',{x:-70,y:-60,rotation:-9,scale:1.05},{x:240,y:-410,rotation:-9,duration:18.6,ease:'none'},0);
      tl.to('#film-field',{opacity:.17,duration:.25},4.44);
      tl.to('#film-field',{opacity:.27,duration:.25},6.5);
      // Verdict impact matches the measured onset of "Blocked".
      tl.to('#film-ground',{backgroundColor:'#FFF0F3',duration:.07,ease:'power2.out'},10.76);
      tl.to('#film-field',{opacity:.5,duration:.25},10.76);
      tl.to('#film-field',{scale:1.24,duration:.32,ease:'power4.inOut'},13.8);
      tl.to('#film-ground',{backgroundColor:'#F5F5F5',duration:.25,ease:'power2.inOut'},14.08);
      tl.to('#film-field',{opacity:.28,duration:.3},14.08);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
