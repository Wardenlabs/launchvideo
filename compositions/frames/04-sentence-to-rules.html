<template>

    @font-face{font-family:"Inter";font-weight:100 900;font-style:normal;font-display:block;src:url("assets/fonts/Inter-Variable.ttf") format("truetype");}

    .f04-stage{position:absolute;inset:0}
    /* Fragments, not screens (the rule frame 1 set). This frame used to be the
       whole console with a camera flying around it; the one thing the product
       does — a sentence becoming five rules — was lost inside a list with five
       columns. Now: the sentence, a button alone, and the click's consequence.
       Warden's side is cool white, hairlines, graphite, flat — no shadow, which
       is how it is told apart from Claude's warm, shadowed box in frame 1. */
    .f04-tint{position:absolute;inset:0;background:rgba(52,211,153,.12)}
    .f04-layer{position:absolute;inset:0;transform-origin:50% 50%}
    .f04-center{display:flex;align-items:center;justify-content:center}

    /* A. the sentence */
    .f04-label{position:absolute;left:250px;top:378px;font-family:"Geist Mono";font-size:30px;line-height:1;color:#7D8788}
    .f04-box{position:absolute;left:230px;top:440px;width:2700px;height:200px;background:#FFFFFF;border:1px solid #DDE2DF;border-radius:64px}
    .f04-txt{position:absolute;left:70px;top:45px;height:110px;font-size:84px;line-height:110px;white-space:pre;color:#22282A}

    /* Frame 3's line, continued: same place, same size (6.2cqw at the 1.06 it

    .f04-fly{position:absolute;left:50%;top:50%;margin-top:-69.4px;font-family:"Manrope";font-weight:600;font-size:126.2px;line-height:1.1;letter-spacing:-.05em;white-space:nowrap;color:#22282A;transform-origin:0% 50%;z-index:5}

    /* B/C. a button alone. The composer's send is the one pill in the system. */

    .f04-btn{height:210px;padding:0 124px;border-radius:105px;background:#22282A;color:#FFFFFF;display:grid;place-items:center;font-size:82px;font-weight:500;white-space:nowrap}
    .f04-cursor{position:absolute;right:-70px;bottom:-110px;width:210px;height:210px;transform-origin:12% 10%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.28))}

    /* the rules */
    .f04-rules{position:absolute;left:340px;top:134px;width:1240px}
    .f04-fb{position:relative;height:96px;display:flex;align-items:center;gap:26px;padding:0 36px;background:#E9F8F1;border:1px solid #BFEBD8;border-radius:16px;margin-bottom:24px}
    .f04-tick{flex:none;width:48px;height:48px;border-radius:50%;background:#34D399;display:grid;place-items:center;color:#FFFFFF;font-size:30px;font-weight:700;line-height:1}
    .f04-fbt{position:absolute;left:110px;top:0;line-height:96px;font-size:42px;font-weight:600;white-space:nowrap}
    .f04-n{display:inline-block;transform-origin:50% 60%}
    .f04-rule{position:relative;height:124px;margin-bottom:18px;display:flex;align-items:center;padding:0 44px;background:#FFFFFF;border:1px solid #E7EAE8;border-radius:16px;font-size:46px;font-weight:500}
    .f04-dot{flex:none;width:20px;height:20px;border-radius:50%;background:#C3C9C6;margin-right:30px}
    .f04-name{flex:1;white-space:nowrap}
    .f04-b{display:flex;align-items:center;gap:16px;font-size:40px;font-weight:500;white-space:nowrap;transform-origin:50% 50%}
    .f04-b i{width:18px;height:18px;border-radius:50%}
    .f04-eff i{background:#FF3B5C}
    .f04-act{margin-right:56px}
    .f04-act i{background:#34D399}

  </style>

      <!-- the rules -->
      <div data-hf-id="hf-a4zw" class="f04-layer" id="f04-cam">
        <div data-hf-id="hf-ofd7" class="f04-layer" id="f04-rulescene">
          <div data-hf-id="hf-53lw" class="f04-rules">
            <div data-hf-id="hf-crie" class="f04-fb" id="f04-fb"><span data-hf-id="hf-qg74" class="f04-tick" id="f04-tick">✓</span><span data-hf-id="hf-q119" class="f04-fbt" id="f04-t1"><span data-hf-id="hf-p7qw" class="f04-n" id="f04-n">1</span> rules created</span><span data-hf-id="hf-aeak" class="f04-fbt" id="f04-t2">5 rules activated</span></div>
            <div data-hf-id="hf-qmgd" class="f04-rule"><span data-hf-id="hf-o793" class="f04-dot"></span><span data-hf-id="hf-1lml" class="f04-name">Customer contact details</span><span data-hf-id="hf-llob" class="f04-b f04-act"><i data-hf-id="hf-wt6k"></i>Active</span><span data-hf-id="hf-62n1" class="f04-b f04-eff"><i data-hf-id="hf-zeb8"></i>Block</span></div>
            <div data-hf-id="hf-x0bl" class="f04-rule"><span data-hf-id="hf-ctdj" class="f04-dot"></span><span data-hf-id="hf-lr4u" class="f04-name">Credentials and API keys</span><span data-hf-id="hf-ljuj" class="f04-b f04-act"><i data-hf-id="hf-y7e5"></i>Active</span><span data-hf-id="hf-xp81" class="f04-b f04-eff"><i data-hf-id="hf-ylp6"></i>Block</span></div>
            <div data-hf-id="hf-y78o" class="f04-rule"><span data-hf-id="hf-cf2i" class="f04-dot"></span><span data-hf-id="hf-x6up" class="f04-name">Unreleased financials</span><span data-hf-id="hf-l5ji" class="f04-b f04-act"><i data-hf-id="hf-0l8b"></i>Active</span><span data-hf-id="hf-yw54" class="f04-b f04-eff"><i data-hf-id="hf-0zjc"></i>Block</span></div>
            <div data-hf-id="hf-xsxn" class="f04-rule"><span data-hf-id="hf-c0rh" class="f04-dot"></span><span data-hf-id="hf-ya9n" class="f04-name">Source code</span><span data-hf-id="hf-kr8h" class="f04-b f04-act"><i data-hf-id="hf-zsm9"></i>Active</span><span data-hf-id="hf-yhu3" class="f04-b f04-eff"><i data-hf-id="hf-06xa"></i>Block</span></div>
            <div data-hf-id="hf-vtei" class="f04-rule"><span data-hf-id="hf-eswo" class="f04-dot"></span><span data-hf-id="hf-t7bg" class="f04-name">Internal documents</span><span data-hf-id="hf-kcxg" class="f04-b f04-act"><i data-hf-id="hf-26gf"></i>Active</span><span data-hf-id="hf-sgbu" class="f04-b f04-eff"><i data-hf-id="hf-2krg"></i>Block</span></div>
          </div>
        </div>
      </div>

      <!-- A. the sentence -->
      <div data-hf-id="hf-hn1g" class="f04-layer" id="f04-sentence">
        <div data-hf-id="hf-11nx" class="f04-label" id="f04-label">warden</div>
        <div data-hf-id="hf-k2jm" class="f04-box" id="f04-box">
          <div data-hf-id="hf-iljt" class="f04-txt"><span data-hf-id="hf-vi3i" class="f04-ph" id="f04-ph">Write the rule in a sentence…</span><span data-hf-id="hf-vpbv" id="f04-typed"></span><span data-hf-id="hf-4n0j" class="f04-caret" id="f04-caret"></span></div>
        </div>
      </div>
      <div data-hf-id="hf-uogp" class="f04-fly" id="f04-fly">Write the rule in a sentence</div>

      <!-- B, C. one button at a time -->
      <div data-hf-id="hf-34fz" class="f04-layer f04-center" id="f04-s1"><div data-hf-id="hf-q9gt" class="f04-btnw" id="f04-bw1"><div data-hf-id="hf-tn7h" class="f04-btn" id="f04-b1">Draft rules</div><svg data-hf-id="hf-g9jk" class="f04-cursor" id="f04-c1" viewBox="0 0 100 100"><path data-hf-id="hf-j5te" d="M14 10 L14 84 L36 62 L82 62 Z" fill="#111111" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" /></svg></div></div>
      <div data-hf-id="hf-ugk4" class="f04-layer f04-center" id="f04-s2"><div data-hf-id="hf-u7ku" class="f04-btnw" id="f04-bw2"><div data-hf-id="hf-klox" class="f04-btn" id="f04-b2">Activate 5 rules</div><svg data-hf-id="hf-zptn" class="f04-cursor" id="f04-c2" viewBox="0 0 100 100"><path data-hf-id="hf-bldi" d="M14 10 L14 84 L36 62 L82 62 Z" fill="#111111" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" /></svg></div></div>

  <script>
    (function () {
      Array.prototype.forEach.call(document.querySelectorAll("#f04-stage *"), function (el) {
        el.setAttribute("data-layout-allow-overlap", "");
        el.setAttribute("data-layout-allow-occlusion", "");
        el.setAttribute("data-layout-allow-overflow", "");
      });
      var typed = document.getElementById("f04-typed"), nEl = document.getElementById("f04-n");
      var text = "make sure no one leaks data";
      var k = { v: 0 }, cnt = { v: 1 };
      typed.textContent = "";
      var rows = gsap.utils.toArray(".f04-rule");

      gsap.set(["#f04-tint", "#f04-fb", "#f04-t2", "#f04-ph", "#f04-bw1", "#f04-bw2", "#f04-box", "#f04-label"], { opacity: 0 });
      gsap.set([rows, ".f04-eff", ".f04-act"], { opacity: 0 });
      gsap.set(["#f04-c1", "#f04-c2"], { x: 620, y: 440 });

      var tl = gsap.timeline({ paused: true });
      function through() { return { scale: 1.9, opacity: 0, filter: "blur(22px)", duration: 0.26, ease: "power4.in" }; }
      // The same hand as frame 1: x and y on different curves make an arc, a
      // small overshoot, a settle, and only then the click. The viewer learns the
      // gesture once and reads the next click without being told.
      function hand(c, btn, t) {
        tl.to(c, { x: -12, duration: 0.5, ease: "expo.out" }, t);
        tl.to(c, { y: -8, duration: 0.5, ease: "power2.out" }, t);
        tl.to(c, { x: 0, y: 0, duration: 0.14, ease: "power2.inOut" }, t + 0.5);
        tl.to([btn, c], { scale: 0.9, duration: 0.06, ease: "power2.in" }, t + 0.68);
        tl.to([btn, c], { scale: 1, duration: 0.2, ease: "back.out(4)" }, t + 0.75);
        return t + 0.82;   // three still frames later: the consequence
      }

      // — A. The hinge, then the sentence. 27 characters fit the frame at this
      //   size, so nothing has to move while it is read. —
      tl.fromTo(["#f04-box", "#f04-label"], { opacity: 0, scale: 0.7, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out", transformOrigin: "20% 50%" }, 0.12);
      tl.set(["#f04-box", "#f04-label"], { filter: "none" }, 0.58);
      tl.fromTo("#f04-fly", { xPercent: -50, x: 0, y: 0, scale: 1, opacity: 1 }, { xPercent: 0, x: -659, y: 0, scale: 0.63, duration: 0.7, ease: "power4.inOut" }, 0.02);
      tl.to("#f04-fly", { opacity: 0, duration: 0.14 }, 0.66);
      tl.to("#f04-ph", { opacity: 1, duration: 0.14 }, 0.66);
      tl.to("#f04-ph", { opacity: 0, duration: 0.08 }, 1.02);
      tl.to(k, { v: text.length, duration: 0.9, ease: "none", onUpdate: function () { typed.textContent = text.slice(0, Math.round(k.v)); } }, 1.06);
      tl.fromTo("#f04-sentence", { scale: 1 }, { scale: 1.04, duration: 1.2, ease: "none" }, 1.06);
      tl.to("#f04-caret", { opacity: 0, duration: 0.01 }, 2.2);
      tl.to("#f04-sentence", through(), 2.28);

      // — B. "Draft rules" — the console's own label — alone, and the hand. —
      tl.fromTo("#f04-bw1", { opacity: 0, scale: 0.12 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.5)" }, 2.44);
      var c1 = hand("#f04-c1", "#f04-b1", 2.6);

      // — The consequence, and the point of the film: the button comes apart
      //   into five rules. They leave from where it was, fan to their places, and
      //   the banner counts them in. —
      tl.to("#f04-c1", { x: 360, y: 300, opacity: 0, duration: 0.3, ease: "power3.in" }, c1);
      tl.to("#f04-b1", { scaleX: 1.5, scaleY: 0.2, opacity: 0, duration: 0.2, ease: "power4.in" }, c1);
      tl.fromTo("#f04-fb", { opacity: 0, scale: 0.85, y: 300 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, c1 + 0.12);
      rows.forEach(function (r, i) {
        // slot i sits (i - 2) * 142 from the middle row; they all start on the button.
        tl.fromTo(r, { opacity: 0, y: -(i - 1.6) * 142, scaleX: 0.5, scaleY: 0.4 }, { opacity: 1, y: 0, scaleX: 1, scaleY: 1, duration: 0.5, ease: "back.out(1.5)" }, c1 + 0.14 + i * 0.09);
        if (i < 4) tl.fromTo("#f04-n", { scale: 1.6 }, { scale: 1, duration: 0.09, ease: "power4.out", immediateRender: false }, c1 + 0.14 + i * 0.09);
      });
      tl.to(cnt, { v: 5, duration: 0.36, ease: "none", onUpdate: function () { nEl.textContent = String(Math.round(cnt.v)); } }, c1 + 0.14);
      tl.fromTo("#f04-n", { scale: 1.9 }, { scale: 1, duration: 0.32, ease: "back.out(3)", immediateRender: false }, c1 + 0.52);
      tl.fromTo(".f04-eff", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3.2)", stagger: 0.09 }, c1 + 0.62);
      tl.fromTo("#f04-rulescene", { scale: 1 }, { scale: 1.03, duration: 1.3, ease: "none" }, c1 + 0.2);

      // — C. They recede; "Activate 5 rules" alone; the same hand. —
      var tC = c1 + 1.55;
      tl.to("#f04-rulescene", { scale: 0.84, opacity: 0.3, filter: "blur(9px)", duration: 0.4, ease: "power4.inOut" }, tC);
      tl.fromTo("#f04-bw2", { opacity: 0, scale: 0.12 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.5)" }, tC + 0.12);
      var c2 = hand("#f04-c2", "#f04-b2", tC + 0.3);
      tl.to("#f04-c2", { x: 360, y: 300, opacity: 0, duration: 0.3, ease: "power3.in" }, c2);
      tl.to("#f04-bw2", through(), c2);
      // Second of the film's three clicks, each with its colour: orange, the data
      // left (frame 1); mint, the rules are in force; coral, the send was stopped.
      tl.to("#f04-tint", { opacity: 1, duration: 0.3, ease: "power2.out" }, c2 + 0.06);
      tl.to("#f04-rulescene", { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out" }, c2 + 0.06);
      tl.to(".f04-dot", { backgroundColor: "#34D399", duration: 0.08, stagger: 0.09 }, c2 + 0.36);
      // "Active" is the console's own word under a rule that is in force
      // (web/js/draft-set.js); drawn as Figma's Active badge.
      tl.fromTo(".f04-act", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3.2)", stagger: 0.09 }, c2 + 0.36);
      tl.to("#f04-t1", { opacity: 0, duration: 0.1 }, c2 + 0.8);
      tl.to("#f04-t2", { opacity: 1, duration: 0.14 }, c2 + 0.86);
      tl.fromTo("#f04-fb", { scale: 1 }, { scale: 1.04, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, c2 + 0.86);
      tl.fromTo("#f04-tick", { scale: 1.7 }, { scale: 1, duration: 0.3, ease: "back.out(4)", immediateRender: false }, c2 + 0.86);

      // — Out. There was a wide shot of the whole console here for one draft; the
      //   owner cut it ("no creo necesario mostrar la view completa"). The rows
      //   in force are the last thing seen. —
      var tD = c2 + 1.5;
      tl.set("#f04-rulescene", { filter: "none" }, c2 + 0.5);
      tl.fromTo("#f04-cam", { scale: 1 }, { scale: 1.03, duration: 0.9, ease: "none" }, c2 + 0.6);
      tl.to("#f04-cam", { scale: 2.1, opacity: 0, filter: "blur(24px)", duration: 0.6, ease: "power4.in" }, tD);
      tl.to("#f04-tint", { opacity: 0, duration: 0.6 }, tD);
      window.__timelines["04-sentence-to-rules"] = tl;
    })();
  </script>
</template>
