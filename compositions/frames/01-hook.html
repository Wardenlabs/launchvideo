<template>

    #root{position:absolute;inset:0;container-type:size;overflow:hidden;color:#1F1E1D}

              <div data-hf-id="hf-230i" class="f01-chip" id="f01-chip"><span data-hf-id="hf-n6dp" class="f01-file">customers_export.csv</span><span data-hf-id="hf-3l3w" class="f01-sep">·</span><span data-hf-id="hf-6jus"><span data-hf-id="hf-rqmf" class="f01-count" id="f01-count">0</span> rows</span></div>

      <div data-hf-id="hf-z488" class="f01-send" id="f01-sendstage">

        <div data-hf-id="hf-2vzq" class="f01-btnw" id="f01-btnw">
          <div data-hf-id="hf-zuye" class="f01-btn" id="f01-btn"><svg data-hf-id="hf-z3h1" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path data-hf-id="hf-oeiv" d="M12 19V5" /><path data-hf-id="hf-b92o" d="M5.5 11.5 12 5l6.5 6.5" /></svg></div>
          <svg data-hf-id="hf-qlxe" class="f01-cursor" id="f01-cursor" viewBox="0 0 100 100"><path data-hf-id="hf-j5te" d="M14 10 L14 84 L36 62 L82 62 Z" fill="#111111" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" /></svg>

  <script>
    (function () {
      // Zoomed past the frame edge and stacked on purpose.
      Array.prototype.forEach.call(document.querySelectorAll("#f01-stage *"), function (el) {
        el.setAttribute("data-layout-allow-overlap", "");
        el.setAttribute("data-layout-allow-occlusion", "");
        el.setAttribute("data-layout-allow-overflow", "");
      });
      var p = document.getElementById("f01-prompt");
      var text = "which of these customers are about to churn?";
      p.textContent = "";
      var countEl = document.getElementById("f01-count");
      var n = { v: 0 };

      // One function places the camera, from three numbers the timeline tweens:
      // how much is typed, how close we are, and how far into the pull-back that
      // shows the whole sentence. It writes the text it then measures, so nothing
      // it reads depends on which frame was rendered before (lint flags DOM
      // measurement in callbacks for exactly that reason; this is the safe form).
      // Following the caret, not panning at a speed: Inter is proportional and at
      // a constant pan the caret wanders. The line starts at the left; once the
      // caret reaches 64% of the frame it stays there and the text runs out left.
      var LX = 301, LY = 492, START = 330, CARET = 1230, BOXCY = 555;
      var st = { k: 0, S: 2.3, pb: 0 };
      function place() {
        p.textContent = text.slice(0, Math.round(st.k));
        var w = p.offsetWidth, S = st.S;
        var cx = Math.min(CARET, START + w * S);
        var x = cx - S * (LX + w), y = 520 - S * LY;
        if (st.pb > 0) {
          var fS = Math.min(0.9, 1660 / Math.max(1, w));
          var fx = 960 - fS * (LX + w / 2), fy = 540 - fS * BOXCY;
          S += (fS - S) * st.pb; x += (fx - x) * st.pb; y += (fy - y) * st.pb;
        }
        gsap.set("#f01-world", { scale: S, x: x, y: y });
      }
      place();

      gsap.set(["#f01-chip", "#f01-btnw", "#f01-glow"], { opacity: 0 });
      gsap.set("#f01-cursor", { x: 640, y: 470 });

      var tl = gsap.timeline({ paused: true });

      // — 1. The line. Born very close on its first letters and pulling back while
      //   they are typed (the reference does exactly this), then the caret holds
      //   its place. 1.5s for 44 characters: slower than the 1.2s settled on when
      //   the text was small and still, because now it is huge and moving. —
      tl.fromTo("#f01-frag", { opacity: 0, x: 420, filter: "blur(14px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 0.2);
      tl.set("#f01-frag", { filter: "none" }, 0.61);
      tl.to(st, { k: text.length, duration: 1.5, ease: "none", onUpdate: place }, 0.55);
      tl.to(st, { S: 1, duration: 1.0, ease: "expo.out", onUpdate: place }, 0.55);

      // — 2. Pull back: the whole sentence at once, and the file lands under it.
      //   Prompt and file are one thought — this question, with this data — so the
      //   chip has no beat of its own. The count is the leak. —
      tl.to(st, { pb: 1, duration: 0.36, ease: "power4.inOut", onUpdate: place }, 2.1);
      tl.to("#f01-caret", { opacity: 0, duration: 0.01 }, 2.3);
      tl.fromTo("#f01-chip", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(3)" }, 2.36);
      tl.to(n, { v: 4812, duration: 0.56, ease: "power4.out", onUpdate: function () { countEl.textContent = Math.round(n.v).toLocaleString("en-US"); } }, 2.44);
      tl.fromTo("#f01-count", { scale: 1 }, { scale: 1.28, duration: 0.56, ease: "power4.out" }, 2.44);
      tl.to("#f01-count", { scale: 1, duration: 0.26, ease: "back.out(4)" }, 3.01);

      // — 3. Out through the camera; the send button arrives alone from depth, on
      //   the same axis, so two separate objects still read as one travel. —
      tl.to("#f01-out", { scale: 1.9, opacity: 0, filter: "blur(22px)", duration: 0.26, ease: "power4.in" }, 3.3);
      tl.fromTo("#f01-btnw", { opacity: 0, scale: 0.12 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.5)" }, 3.46);
      // The cursor moves like a hand: x and y on different curves make an arc, it
      // overshoots a little, settles, and only then clicks.
      tl.to("#f01-cursor", { x: -12, duration: 0.5, ease: "expo.out" }, 3.62);
      tl.to("#f01-cursor", { y: -8, duration: 0.5, ease: "power2.out" }, 3.62);
      tl.to("#f01-cursor", { x: 0, y: 0, duration: 0.14, ease: "power2.inOut" }, 4.12);
      // Click: both give on the same frame. Then three frames of nothing, and the
      // colour goes out. The stillness is what makes it land.
      tl.to(["#f01-btn", "#f01-cursor"], { scale: 0.88, duration: 0.06, ease: "power2.in" }, 4.3);
      tl.to(["#f01-btn", "#f01-cursor"], { scale: 1, duration: 0.2, ease: "back.out(4)" }, 4.37);
      // Claude's orange, not a verdict colour: it marks the moment the data left.
      // Frame 5 answers it — same button, same click, and the ground goes coral.
      tl.fromTo("#f01-glow", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 5.2, duration: 0.5, ease: "expo.out" }, 4.44);

      // — 4. Pull away: frame 2's wall arrives underneath on the same pull-back,
      //   and this button becomes one of forty. —
      tl.to("#f01-btnw", { scale: 0.1, duration: 0.55, ease: "expo.out" }, 4.72);
      tl.to("#f01-btnw", { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.8);
      tl.to("#f01-glow", { opacity: 0, scale: 7, duration: 0.55, ease: "power2.out" }, 4.74);
      window.__timelines["01-hook"] = tl;
    })();
  </script>
