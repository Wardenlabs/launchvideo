    .f05-no{width:4.6cqw;height:4.6cqw;border-radius:50%;background:#FF3B5C;flex:none}
  </style>

  <div data-hf-id="hf-zkxl" id="root" data-composition-id="05-blocked" data-width="1920" data-height="1080">
    <div data-hf-id="hf-jtb8" class="clip f05-tint" id="f05-pink" data-start="0" data-duration="5.6" data-track-index="1"></div>

    <div data-hf-id="hf-p7rv" class="clip f05-stage" id="f05-stage" data-start="0" data-duration="5.6" data-track-index="2">
      <div data-hf-id="hf-nqpu" class="f05-world" id="f05-world">

        <div data-hf-id="hf-gqgp" class="f05-term" id="f05-t1">
          <div data-hf-id="hf-jsbm" class="f05-pline"><span data-hf-id="hf-d6hz" id="f05-p1"></span><span data-hf-id="hf-luty" class="f05-caret" id="f05-caret1"></span></div>
          <div data-hf-id="hf-hna6" class="f05-chiprow">
            <div data-hf-id="hf-0mta" class="f05-chip" id="f05-file"><b data-hf-id="hf-z9hb">customers_export.csv</b><span data-hf-id="hf-1bmq">·</span><span data-hf-id="hf-6jus"><b data-hf-id="hf-hrk8" class="n">4,812</b> rows</span></div>
            <div data-hf-id="hf-q06v" class="f05-chip red" id="f05-zero"><span data-hf-id="hf-kiea"><b data-hf-id="hf-jclr" class="n" id="f05-count">4,812</b> rows sent</span></div>

          <div data-hf-id="hf-swrg" class="f05-r" id="f05-r2"><span data-hf-id="hf-csfz" class="f05-d"></span><span data-hf-id="hf-rijg">Credentials and API keys</span><span data-hf-id="hf-fazl" class="f05-st">clear</span></div>

  <script>
    (function () {
      // The world and the stamp overlap on purpose: each one takes the frame
      // while the other recedes behind it.
      document.querySelectorAll("#f05-world *, #f05-say *").forEach(function (el) {
        el.setAttribute("data-layout-allow-overlap", "");
        el.setAttribute("data-layout-allow-occlusion", "");
        el.setAttribute("data-layout-allow-overflow", "");
      });

      var p1 = document.getElementById("f05-p1"), t1txt = "which of these customers are about to churn?", k1 = { v: 0 };
      p1.textContent = "";
      var countEl = document.getElementById("f05-count"), n = { v: 4812 };

      gsap.set(["#f05-pink", "#f05-t1", "#f05-rules", "#f05-file", "#f05-zero", "#f05-stamp", "#f05-rbg"], { opacity: 0 });
      gsap.set([".f05-st", ".f05-r"], { opacity: 0 });

      var tl = gsap.timeline({ paused: true });

      // ── 1. frame 1 again, fast: the viewer knows it and expects the same ending ──
      tl.fromTo("#f05-world", { scale: 1.12, x: 330, y: 60 }, { scale: 1.2, x: 350, y: 60, duration: 1.3, ease: "none" }, 0);
      tl.fromTo("#f05-t1", { opacity: 0, scale: 0.62, y: 70, filter: "blur(18px)" }, { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.42, ease: "back.out(2.2)" }, 0.05);
      tl.to(k1, { v: t1txt.length, duration: 0.5, ease: "none", onUpdate: function () { p1.textContent = t1txt.slice(0, Math.round(k1.v)); } }, 0.3);
      tl.fromTo("#f05-file", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(3)" }, 0.85);
      tl.to("#f05-caret1", { opacity: 0, duration: 0.01 }, 1.3);
      tl.to("#f05-send1", { scale: 0.8, duration: 0.07, ease: "power2.in" }, 1.28);
      tl.to("#f05-send1", { scale: 1, duration: 0.2, ease: "back.out(4)" }, 1.36);
      tl.to("#f05-t1", { scale: 0.965, duration: 0.07, ease: "power2.in" }, 1.3);
      tl.to("#f05-t1", { scale: 1, duration: 0.15, ease: "back.out(3)" }, 1.38);

      // ── 2. the check: the five rules from frame 4, and the camera goes to them ──
      tl.to("#f05-world", { scale: 1.42, x: -700, y: 170, duration: 0.42, ease: "power4.inOut" }, 1.4);
      tl.fromTo("#f05-rules", { opacity: 0, scale: 0.7, x: -60 }, { opacity: 1, scale: 1, x: 0, duration: 0.36, ease: "back.out(2)" }, 1.42);
      tl.fromTo(".f05-r", { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.2, ease: "power4.out", stagger: 0.04 }, 1.5);
      // Bottom to top, quick and even — tick, tick, tick, tick — then a held beat.
      [["#f05-r5", 1.85], ["#f05-r4", 1.97], ["#f05-r3", 2.09], ["#f05-r2", 2.21]].forEach(function (r) {
        tl.to(r[0] + " .f05-d", { backgroundColor: "#7D8788", duration: 0.05 }, r[1]);
        tl.fromTo(r[0] + " .f05-d", { scale: 1 }, { scale: 1.8, duration: 0.08, yoyo: true, repeat: 1, immediateRender: false }, r[1]);
        tl.to(r[0] + " .f05-st", { opacity: 1, duration: 0.06 }, r[1]);
      });
      tl.to("#f05-world", { scale: 1.5, x: -745, y: 215, duration: 0.35, ease: "none" }, 1.85);

      // ── 3. the hit ──
      var HIT = 2.55;
      tl.to("#f05-r1 .f05-d", { backgroundColor: "#FF3B5C", duration: 0.04 }, HIT);
      tl.to(["#f05-rbg", "#f05-r1 .f05-st"], { opacity: 1, duration: 0.05 }, HIT);
      tl.fromTo("#f05-r1", { scale: 1 }, { scale: 1.06, duration: 0.09, yoyo: true, repeat: 1, immediateRender: false }, HIT);
      tl.to("#f05-pink", { opacity: 1, duration: 0.07, ease: "power2.out" }, HIT + 0.05);
      // It does not go through the camera this time. It bounces off.
      tl.to("#f05-world", { scale: 0.84, x: 0, y: 0, filter: "blur(9px)", opacity: 0.45, duration: 0.26, ease: "expo.out" }, HIT + 0.05);
      tl.fromTo("#f05-stamp", { opacity: 0, scale: 3.2, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.in" }, HIT + 0.06);
      // It lands, gives, and recovers: the squash is what makes it a stamp and not a fade.
      tl.to("#f05-stamp", { scale: 0.93, duration: 0.05, ease: "power2.out" }, HIT + 0.27);
      tl.to("#f05-stamp", { scale: 1, duration: 0.2, ease: "back.out(4)" }, HIT + 0.33);
      [[-22, 0.05], [18, 0.06], [-11, 0.06], [6, 0.06], [0, 0.1]].reduce(function (t, s) {
        tl.to("#f05-stamp", { x: s[0], duration: s[1], ease: "power1.inOut" }, t);
        return t + s[1];
      }, HIT + 0.27);
      tl.fromTo("#f05-stamp", { scale: 1 }, { scale: 1.04, duration: 0.5, ease: "none", immediateRender: false }, HIT + 0.62);
      tl.to("#f05-stamp", { scale: 1.6, opacity: 0, filter: "blur(18px)", duration: 0.22, ease: "power4.in" }, HIT + 1.14);

      // ── 4. the consequence: one thing, the chip counting back to zero. The card
      //    with the hook's output ("Blocked by Warden / Rule: …") is gone: it came
      //    straight after a stamp that says Blocked, said it again in small type,
      //    and the frame sat on it (owner, v19). ──
      tl.to("#f05-world", { scale: 1.34, x: 440, y: 240, filter: "blur(0px)", opacity: 1, duration: 0.42, ease: "power4.inOut" }, HIT + 1.2);
      tl.to("#f05-pink", { opacity: 0.6, duration: 0.5 }, HIT + 1.2);
      tl.to("#f05-file", { opacity: 0.4, duration: 0.2 }, HIT + 1.3);
      tl.fromTo("#f05-zero", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, HIT + 1.3);
      // Frame 1 counted up to 4,812. This counts them back.
      tl.to(n, { v: 0, duration: 0.6, ease: "power4.out", onUpdate: function () { countEl.textContent = Math.round(n.v).toLocaleString("en-US"); } }, HIT + 1.45);
      tl.to("#f05-world", { scale: 1.4, x: 462, y: 252, duration: 0.85, ease: "none" }, HIT + 1.64);

      // ── 5. out. "0 rows sent" is held still for half a second, then the
      //    scene leaves through the camera like every other, and the film moves
      //    on to why to believe it. The honest request that used to follow
      //    ("refactor this module" → Allowed → "Everything else goes through")
      //    was cut by the owner on 2026-09-22: that Warden lets ordinary work
      //    through is obvious, and the frame is about the one thing it stops.
      //    The Allowed verdict is still seen, in the opener's cloud of rows. ──
      tl.to("#f05-world", { scale: 2.3, x: 700, y: 400, opacity: 0, filter: "blur(26px)", duration: 0.5, ease: "power4.in" }, 5.1);
      tl.to("#f05-pink", { opacity: 0, duration: 0.5, ease: "power2.in" }, 5.1);
      window.__timelines["05-blocked"] = tl;
    })();
  </script>
